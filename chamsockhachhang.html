<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
         <link rel="icon" type="image/png" href="https://matkinhsaigonone.com/wp-content/uploads/2026/05/Favicon_Eyesoft.png">
    <link rel="shortcut icon" type="image/x-icon" href="https://matkinhsaigonone.com/wp-content/uploads/2026/05/Favicon_Eyesoft.png">
    <title>Chăm sóc khách hàng - EyeSoft</title>
    <script>
    // Tự tạo blob manifest để tránh lỗi file hệ thống
    const manifest = {
      "name": "EyeSoft CSKH",
      "short_name": "EyeSoftKH",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#ffffff",
      "theme_color": "#0d6efd",
      "icons": [{ "src": "https://matkinhsaigonone.com/wp-content/uploads/2026/05/Favicon_Eyesoft.png", "sizes": "192x192", "type": "image/png" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  </script>
    <style>
        body, html { margin:0; padding:0; height:100%; width:100%; overflow:hidden; }
        #cskhFrame { width:100%; height:100%; border:none; }
    </style>
</head>
<body>
    <iframe id="cskhFrame" src="" allow="geolocation; microphone; camera"></iframe>
    
    <script>
        // 1. Đường link Web App của bạn (đảm bảo copy đủ cả /exec)
        const SCRIPT_BASE_URL = "https://script.google.com/macros/s/AKfycbwSUQrUAfKQbr83M7Z-ISc_acYfyWD6hjQJT7UoORzJ42ObusKmCi9D1THjqNbtNE96IQ/exec";
        
        // 2. Lấy toàn bộ tham số từ URL hiện tại (ví dụ: ?page=Chamsockhachhang&ssid=1dqb9...)
        const params = window.location.search;
        
        // 3. Ghép nối để tạo link hoàn chỉnh
        const finalUrl = SCRIPT_BASE_URL + params;
        
        const iframe = document.getElementById('cskhFrame');
        iframe.src = finalUrl;
        
        // 4. Debug: In ra console để biết link đang gọi là gì (Nhấn F12 để xem)
        console.log("Đang load vào iframe: ", finalUrl);

        // 5. Nếu không có tham số SSID, thông báo lỗi cho người dùng biết
        if (!params.includes('ssid=')) {
            console.error("Thiếu tham số SSID trong đường dẫn!");
            // Bạn có thể redirect về trang chủ hoặc hiện thông báo tại đây
        }
    </script>
</body>
</html>
